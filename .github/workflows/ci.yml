name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders — Prisma generate/typecheck/build never connect to a real
  # database; real secrets live only on the VPS (.env, never in CI).
  DATABASE_URL: postgresql://pdv:pdv@localhost:5432/pdv?schema=public
  SESSION_SECRET: ci-placeholder-secret-not-used-in-production
  CORS_ORIGIN: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true # ver docs/specs/08-seguranca.md § 11 — falha vira decisão explícita, não bloqueio automático ainda

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Fluxos críticos de ponta a ponta contra API + web reais (Postgres de serviço;
  # sem MinIO — a API sobe mesmo assim, só o upload de foto ficaria indisponível).
  e2e:
    runs-on: ubuntu-latest
    needs: ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # usuário da aplicação sem superusuário, como na VPS (RLS precisa disso)
      DATABASE_URL: postgresql://pdv:pdv@localhost:5432/pdv?schema=public
      SESSION_SECRET: e2e-secret-not-used-in-production
      NODE_ENV: development
      APP_BASE_DOMAIN: app.localhost
      CORS_ORIGIN: http://demo.app.localhost:3000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: none
      STORAGE_SECRET_KEY: none
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the app database role (no superuser)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE ROLE pdv LOGIN PASSWORD 'pdv' NOSUPERUSER NOBYPASSRLS;" -c "CREATE DATABASE pdv OWNER pdv;"
      - name: Resolve the demo tenant host
        run: echo "127.0.0.1 demo.app.localhost" | sudo tee -a /etc/hosts
      - name: Build shared, migrate and seed
        run: |
          pnpm --filter shared build
          pnpm --filter api db:generate
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api db:seed
      - name: Start API and web
        run: |
          pnpm --filter api build
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm dev > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3001/docs >/dev/null && curl -sf -H 'Host: demo.app.localhost:3000' http://localhost:3000/login >/dev/null && break; sleep 2; done
      - name: Cypress E2E
        run: pnpm --filter web cy:run:e2e
      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log

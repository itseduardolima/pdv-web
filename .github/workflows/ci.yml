name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders — Prisma generate/typecheck/build never connect to a real
  # database; real secrets live only on the VPS (.env, never in CI).
  DATABASE_URL: postgresql://pdv:pdv@localhost:5432/pdv?schema=public
  SESSION_SECRET: ci-placeholder-secret-not-used-in-production
  CORS_ORIGIN: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true # ver docs/specs/08-seguranca.md § 11 — falha vira decisão explícita, não bloqueio automático ainda

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Fluxos críticos de ponta a ponta contra API + web reais (Postgres de serviço;
  # sem MinIO — a API sobe mesmo assim, só o upload de foto ficaria indisponível).
  e2e:
    runs-on: ubuntu-latest
    needs: ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # usuário da aplicação sem superusuário, como na VPS (RLS precisa disso)
      DATABASE_URL: postgresql://pdv:pdv@localhost:5432/pdv?schema=public
      SESSION_SECRET: e2e-secret-not-used-in-production
      # PlatformModule (Épico 13) usa getOrThrow — sem isso a API nem sobe
      # (crash silencioso: o loop de espera só faz curl e desiste sem falhar
      # o step, então os testes seguintes viam ECONNREFUSED/500 sem pista).
      PLATFORM_SESSION_SECRET: e2e-platform-secret-not-used-in-production
      # 10 specs de login repetido na mesma IP/instância batem no throttle
      # de PIN (08-seguranca § 5) rapidinho — mesmo motivo de já desligar
      # isso no .env de dev local (apps/api/.env.example), nunca em produção.
      RATE_LIMIT_ENABLED: 'false'
      NODE_ENV: development
      APP_BASE_DOMAIN: app.localhost
      CORS_ORIGIN: http://demo.app.localhost:3000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: none
      STORAGE_SECRET_KEY: none
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the app database role (no superuser)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE ROLE pdv LOGIN PASSWORD 'pdv' NOSUPERUSER NOBYPASSRLS;" -c "CREATE DATABASE pdv OWNER pdv;"
      - name: Resolve the demo tenant host
        run: echo "127.0.0.1 demo.app.localhost" | sudo tee -a /etc/hosts
      - name: Build shared, migrate and seed
        run: |
          pnpm --filter shared build
          pnpm --filter api db:generate
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api db:seed
      - name: Start API and web
        run: |
          pnpm --filter api build
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm dev > /tmp/web.log 2>&1 &)
          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/docs >/dev/null && curl -sf -H 'Host: demo.app.localhost:3000' http://localhost:3000/login >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "::error::API/web não ficaram prontos em 120s — logs:"
            tail -n 100 /tmp/api.log /tmp/web.log
            exit 1
          fi
      - name: Warm up Next.js dev routes
        # `next dev` compila cada rota sob demanda na primeira visita — na
        # primeira vez, num runner compartilhado, isso passa fácil dos 10s
        # de timeout padrão do Cypress (visto de verdade: critical-flow.cy.ts
        # travando em '/open-register' esperando '/sell' compilar). Visitar
        # cada rota uma vez aqui (fora do timing de nenhum teste) força essa
        # compilação adiantada, sem mudar nenhum comportamento em produção
        # (lá é build estático via `next build`, sem essa lentificação).
        run: |
          for path in /login /open-register /sell /products /products/new /closing /dashboard /operators /operators/new /settings /reports /history /forgot-pin; do
            curl -s -H 'Host: demo.app.localhost:3000' "http://localhost:3000$path" >/dev/null || true
          done
      - name: Cypress E2E
        run: pnpm --filter web cy:run:e2e
      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log

  # HU 9.4: só em push na main (nunca em pull_request), depois que ci + e2e
  # passaram — sem passo manual fora do CI (09-operacao § 5). Precisa dos
  # secrets DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY (e opcionalmente
  # DEPLOY_PATH, default abaixo) configurados no repositório — ver
  # 09-operacao.md § 5 para o que cada um significa e como gerar a chave.
  deploy:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Sem isso, um SSH travado (rede instável, build pendurado) some no
    # default de 6h do GitHub Actions — e como cancel-in-progress é false
    # (de propósito, nunca cancelar um deploy em andamento), qualquer push
    # seguinte ficaria enfileirado atrás dele até esse limite.
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false # nunca cancelar um deploy em andamento pra começar outro
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/opt/pdv-web' }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            ./scripts/deploy-check.sh
            docker compose up -d --build
            # --build sem limpeza deixa imagem/camada órfã a cada deploy —
            # exatamente o tipo de crescimento silencioso de disco que
            # scripts/disk-space-check.sh (9.8) existe pra pegar, então
            # mata a causa em vez de só alertar depois.
            docker image prune -f
      - name: Wait for the API to answer /health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            for i in $(seq 1 30); do
              curl -sf http://localhost:3001/health && exit 0
              sleep 2
            done
            echo "ERRO: /health não respondeu 200 depois do deploy" >&2
            exit 1

# Defaults valem só para desenvolvimento local (hosts *.localhost, senhas
# triviais). Em produção o .env é obrigatório — rode ./scripts/deploy-check.sh
# antes de `docker compose up`, ele barra .env ausente ou com placeholder.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlinado no bundle do browser em build time (NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.localhost}
        # Mesmo domínio base do APP_BASE_DOMAIN da api (abaixo) — usado só
        # pra montar o endereço da loja (<slug>.<domínio>) exibido no
        # painel Superadmin, nunca pra resolver tenant de verdade.
        NEXT_PUBLIC_APP_BASE_DOMAIN: ${APP_DOMAIN:-app.localhost}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      HOSTNAME: '0.0.0.0'
      # Lido em runtime (lib/env.ts, server-side) pra reconhecer o host do
      # painel Superadmin — precisa bater com o PLATFORM_HOST da api.
      PLATFORM_HOST: ${PLATFORM_HOST:-admin.app.localhost}
    networks:
      - default
      - edge
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Usuário da aplicação (não-superusuário, criado por infra/postgres/init-app-role.sh).
      DATABASE_URL: postgresql://${APP_DB_USER:-pdv}:${APP_DB_PASSWORD:-pdv}@postgres:5432/${APP_DB_NAME:-pdv}?schema=public
      APP_BASE_DOMAIN: ${APP_DOMAIN:-app.localhost}
      CORS_ORIGIN: https://${APP_DOMAIN:-app.localhost},https://*.${APP_DOMAIN:-app.localhost}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: https://${MEDIA_DOMAIN:-media.localhost}/${STORAGE_BUCKET:-pdv-media}
      # Link dos e-mails de PIN aponta para a loja em HTTPS.
      WEB_ORIGIN_TEMPLATE: https://{host}
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Superusuário só para administração/backup; a API usa APP_DB_USER.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      APP_DB_USER: ${APP_DB_USER:-pdv}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-pdv}
      APP_DB_NAME: ${APP_DB_NAME:-pdv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-pdv}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-pdvpdvpdv}
    networks:
      - default
      - edge
    volumes:
      - minio_data:/data

networks:
  edge:
    external: true

volumes:
  postgres_data:
  minio_data:
